[build-system]
requires = ["setuptools>=65.0", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "uc-intg-bluesound"
description = "Bluesound BluOS music streamer integration for Unfolded Circle Remote"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MPL-2.0"}
authors = [
    {name = "Meir Miyara", email = "meir.miyara@gmail.com"}
]
keywords = ["unfoldedcircle", "integration", "bluesound", "blueos", "music", "streamer"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "ucapi-framework>=1.9.5",
    "ucapi>=0.7.0",
    "aiohttp>=3.9.0",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/mase1981/uc-intg-bluesound"
Repository = "https://github.com/mase1981/uc-intg-bluesound"
Issues = "https://github.com/mase1981/uc-intg-bluesound/issues"

[tool.setuptools]
packages = ["uc_intg_bluesound"]

[tool.setuptools.dynamic]
version = {attr = "uc_intg_bluesound.__version__"}

[project.scripts]
uc-intg-bluesound = "uc_intg_bluesound:main"
